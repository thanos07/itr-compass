name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_PARSER_URL: https://parser.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all

      - name: Evaluation benchmark
        run: npm run eval:v1

      - name: Production build
        run: npm run build


  e2e:
    name: Browser E2E smoke
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_PARSER_URL: https://parser.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E smoke tests
        run: npm run test:e2e

  worker:
    name: Parser worker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-test.txt

      - name: Install worker test dependencies
        working-directory: worker
        run: pip install -r requirements-test.txt

      - name: Compile worker
        working-directory: worker
        run: python -m compileall .

      - name: Run parser smoke tests
        working-directory: worker
        run: python test_smoke.py

      - name: Run parser HTTP integration tests
        working-directory: worker
        run: python test_http.py

      - name: Verify FastAPI routes
        working-directory: worker
        run: |
          python -c "import main; paths={r.path for r in main.app.routes}; assert {'/health','/parse'} <= paths; print('Worker routes verified.')"
