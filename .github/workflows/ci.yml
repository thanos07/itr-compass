name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_PARSER_URL: https://parser.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all

      - name: Production build
        run: npm run build

  worker:
    name: Parser worker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install worker dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Compile worker
        working-directory: worker
        run: python -m compileall .

      - name: Verify FastAPI routes
        working-directory: worker
        run: |
          python -c "import main; paths={r.path for r in main.app.routes}; assert {'/health','/parse'} <= paths; print('Worker routes verified.')"